spring.application.name=banking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transferdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-minimum-32-chars}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=7

app.rate-limit.auth.capacity=5
app.rate-limit.auth.period-seconds=60
app.rate-limit.transfer.capacity=10
app.rate-limit.transfer.period-seconds=60